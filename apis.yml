name: Snapette
description: Snapette was a mobile fashion-discovery and local-shopping application that operated from
  2011 to 2013, letting users photograph, share, and discover fashion items and nearby boutique inventory.
  Backed by 500 Global (500 Startups), it was acquired by PriceGrabber in 2013 and subsequently ceased
  operations. This API Evangelist profile is retained as an archival portfolio-company record; the company
  publishes no developer program, API, or SDK surface. The snapette.com domain now serves only an archival
  page documenting the app's history, founders, and business model.
